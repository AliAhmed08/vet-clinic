    <main class="content">
        <div class="pos-container">

            <!-- LEFT: PRODUCTS -->
            <div class="products-section">

                <div class="category-tabs">
                    <button class="tab-btn active" onclick="switchCategory('all', this)">الكل</button>
                    <button class="tab-btn" onclick="switchCategory('medicine', this)">الأدوية</button>
                    <button class="tab-btn" onclick="switchCategory('vaccine', this)">التطعيمات</button>
                    <button class="tab-btn" onclick="switchCategory('accessory', this)">الإكسسوارات</button>
                    <button class="tab-btn" onclick="switchCategory('food', this)">الطعام</button>
                </div>
                <div class="pos-header">
                    <input type="search" id="posSearch" placeholder=" ابحث عن منتج..." />
                    <a href="sales-history.html"><button>سجل المبيعات</button></a>
                </div>

                <div id="productsGrid" class="products-grid"></div>

            </div>

            <!-- CART -->
            <div class="cart-section">

                <h2>🧾 الفاتورة</h2>

                <div id="cartItems" class="cart-items"></div>

                <div class="cart-footer">
                    <h3>الإجمالي: <span id="cartTotal">0</span> جنيه</h3>

                    <button class="checkout-btn" onclick="checkout()">
                        إتمام البيع
                    </button>
                </div>

            </div>

        </div>

        <div id="invoiceModal" class="modal">

            <div class="invoice-wrapper">

                <span id="closeInvoice" class="close">×</span>

                <div id="invoiceContent">

                    <div class="invoice">

                        <div class="invoice-header">
                            <h2 id="clinicName"></h2>
                            <img src="./images/pawprint.png" alt="" id="clinicLogo">
                        </div>

                        <div class="invoice-info">
                            <p>
                                <b>التاريخ : </b>
                                <span id="invoiceDate"></span>
                            </p>

                            <p>
                                <b>الوقت : </b>
                                <span id="invoiceTime"></span>
                            </p>
                        </div>

                        <table>

                            <thead>
                                <tr>
                                    <th>الصنف</th>
                                    <th>الكمية</th>
                                    <th>السعر</th>
                                </tr>
                            </thead>

                            <tbody id="invoiceItems"></tbody>

                        </table>

                        <h3 id="invoiceTotal"></h3>

                        <div class="invoice-footer">
                            <p id="clinicAddress"></p>
                            <p id="clinicPhone"></p>
                        </div>

                    </div>

                </div>

                <button id="printInvoiceBtn">
                    طباعة 🖨️
                </button>

            </div>

        </div>

        <!-- Toast -->
        <div id="toast" class="toast"></div>
    </main>

    <script src="sales.js"></script>
</body>

</html>
