<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>المخزن</title>
    <style>
        @import url("./style.css");

        #productSearch {
            width: 380px;
            max-width: 100%;
            padding: 11px 18px;
            border-radius: var(--r-pill);
            border: 1px solid var(--border-strong);
            margin-bottom: 20px;
            font-size: 14px;
            background: var(--surface-alt);
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: flex-start;
            direction: rtl;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 9px 18px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text-secondary);
            border-radius: var(--r-pill);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 13.5px;
            transition: all var(--t-fast) var(--ease);
        }

        .tab-btn:hover {
            background-color: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary-soft-border);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
        }

        .addBatch {
            border: none;
            padding: 10px 16px;
            border-radius: var(--r-sm);
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            float: left;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 13.5px;
            transition: background var(--t-fast) var(--ease);
        }

        .addBatch:hover {
            background: var(--primary-hover);
        }

        .addBatch:active {
            background: var(--primary-press);
        }

        /* ===== BATCHES GRID ===== */
        #batchesTable {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            clear: both;
        }

        /* ===== BATCH CARD ===== */
        .batch-card {
            background: var(--surface-alt);
            border-radius: var(--r-md);
            padding: 14px;
            border: 1px solid var(--border);
            transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease);
        }

        .batch-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-sm);
        }

        /* low stock */
        .batch-card.low {
            border: 2px solid var(--warning);
            background: var(--warning-light);
        }

        /* ===== TEXT ===== */
        .batch-card span {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ===== BUTTON ===== */
        .batch-card button {
            width: 100%;
            margin-top: 8px;
            padding: 7px;
            border: none;
            border-radius: var(--r-sm);
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background var(--t-fast) var(--ease);
        }

        .batch-card button:hover {
            background: var(--primary-hover);
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 16px;
        }

        /* CARD */
        .product-card {
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            cursor: pointer;
            box-shadow: var(--shadow-xs);
            text-align: center;
            transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease), border-color var(--t-base) var(--ease);
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-soft-border);
        }

        .product-card img {
            width: 110px;
            height: 110px;
            border-radius: var(--r-sm);
            object-fit: cover;
            margin-bottom: 10px;
            background: var(--surface-sunken);
        }

        .name {
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .stock {
            margin-bottom: 4px;
            color: var(--text-secondary);
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-sunken);
            padding: 3px 12px;
            border-radius: var(--r-pill);
        }

        .stock.low {
            background: var(--warning-light);
            color: var(--warning);
            font-weight: 700;
        }

        .product-card.empty {
            opacity: 0.55;
        }

        .product-card.empty .stock {
            background: var(--danger-light);
            color: var(--danger);
            font-weight: 700;
        }

        #productDetailsModal .modal-content {
            padding: 24px;
            max-width: 460px;
            width: 90%;
        }

        #productDetailsModal label {
            display: none;
            flex-direction: row;
            margin: 20px 0;
        }

        #productDetailsModal label input {
            width: 70px;
        }

        #expBatches {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: var(--text-secondary);
            width: fit-content;
            cursor: pointer;
        }

        #productName {
            text-align: center;
            margin: 10px 0 30px;
            font-size: 20px;
        }

        #productStats {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0 18px;
        }

        #productStats p {
            flex: 1;
            /* background: var(--surface-sunken); */
            border-radius: var(--r-md);
            padding: 0 14px;
            margin: 0;
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        #productStats p b {
            /* display: block; */
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 2px;
        }

        #expBatches,
        #showEmptyBatches {
            cursor: pointer;
        }

        .alert-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
            position: fixed;
            top: 25px;
            left: 30px;
            border-radius: var(--r-pill);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            z-index: 50;
        }

        .alert-btn img {
            width: 22px;
        }

        .alert-btn:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .alert-btn span {
            position: absolute;
            top: -4px;
            left: -4px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 50%;
            font-weight: bold;
            min-width: 18px;
            text-align: center;
            border: 2px solid var(--surface);
        }

        .alert-modal {
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .alert-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            padding: 13px 16px;
            border-radius: var(--r-md);
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease);
        }

        .alert-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .alert-card h4 {
            margin: 0;
            color: var(--text-primary);
            font-size: 14.5px;
        }

        .alert-stock {
            font-size: 13px;
            margin-top: 5px;
            color: var(--text-secondary);
        }

        .alert-section {
            margin-top: 22px;
        }

        .alert-section h3 {
            margin-bottom: 12px;
            font-size: 15px;
        }

        .alert-empty {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;
            padding: 20px 0;
        }

        .alert-card.expired {
            background: var(--danger-light);
            border-color: #F6CBD1;
        }

        .alert-card.expired h4 {
            color: var(--danger);
        }

        .alert-card.expiring {
            background: var(--warning-light);
            border-color: #F3DCA8;
        }

        .alert-card.expiring h4 {
            color: var(--warning);
        }

        .alert-card.critical {
            background: var(--danger-light);
            border-color: #F6CBD1;
        }
    </style>
</head>

    <main class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title">المخزن</h1>
                <p class="page-subtitle">تابع المنتجات، الدفعات، ومواعيد الانتهاء</p>
            </div>
        </div>

        <button id="stockAlertBtn" class="alert-btn hidden">
            <img src="./images/alert.png" alt=""> <span id="stockAlertCount"></span>
        </button>
        <div class="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('all', this)">الكل</button>
            <button class="tab-btn" onclick="switchCategory('medicine', this)">الأدوية</button>
            <button class="tab-btn" onclick="switchCategory('vaccine', this)">التطعيمات</button>
            <button class="tab-btn" onclick="switchCategory('accessory', this)">الإكسسوارات</button>
            <button class="tab-btn" onclick="switchCategory('food', this)">الطعام</button>
        </div>

        <input type="search" id="productSearch" placeholder=" ابحث عن منتج..." />

        <button id="addProductBtn" onclick="openAddProductModal()">
            ➕ إضافة منتج
        </button>

        <div class="grid" id="productsGrid"></div>
        <div id="pagination"></div>

        <div id="stockAlertModal" class="modal">
            <div class="modal-content alert-modal">

                <button class="close" onclick="closeModal('stockAlertModal')">×</button>

                <!-- <h2>تنبيهات المخزون ⚠️</h2> -->

                <!-- Low Stock -->
                <div class="alert-section">
                    <h3>🔴 مخزون منخفض</h3>
                    <div id="lowStockList"></div>
                </div>

                <!-- Expired -->
                <div class="alert-section">
                    <h3>⏰ منتجات منتهية / قريبة</h3>
                    <div id="expiryList"></div>
                </div>

            </div>
        </div>

        <div id="productDetailsModal" class="modal">
            <div class="modal-content">

                <button onclick="closeModal('productDetailsModal')" class="close">×</button>


                <h2 id="productName"></h2>

                <button class="addBatch" onclick="openAddBatchInside()">إضافة دفعة جديدة </button>

                <div id="productStats"></div>


                <!-- <h3> الدفعات 📦</h3> -->
                <label id="expBatches">
                    عرض الدفعات المنتهية
                    <input type="checkbox" id="showEmptyBatches" />
                </label>
                <div id="batchesTable"></div>
                <div id="productActions"></div>
            </div>
        </div>

        <!-- Add Modal -->
        <div class="modal" id="addModal">
            <div class="modal-content">
                <h3>إضافة دفعة جديدة </h3>
                <form id="addStockForm">


                    <div class="field">
                        <label for="quantity" class="required-label">الكمية</label>
                        <input id="addQuantity" type="number" min="1" required>
                    </div>

                    <div class="field">
                        <label for="purchasePrice" class="required-label">سعر الشراء <span
                                style="opacity: 0.2;">(للواحدة)</span></label>
                        <input id="purchasePrice" type="number" required>
                    </div>

                    <div class="field">
                        <label for="supplier">اسم المورد</label>
                        <input id="supplier" type="text">
                    </div>

                    <div class="field">
                        <label for="expirydate">تاريخ الانتهاء</label>
                        <input id="addExpiry" type="date">
                    </div>

                    <button type="submit" class="confirm">حفظ</button>
                    <button onclick="closeModal('addModal')" class="cancel">إلغاء</button>
                </form>

            </div>
        </div>



        <div class="modal" id="productModal">
            <div class="modal-content">
                <h3>إضافة منتج</h3>
                <form id="addForm">


                    <div class="field">
                        <label for="newProductName" class="required-label">الاسم</label>
                        <input id="newProductName" required />

                    </div>

                    <div class="field">
                        <label for="productCategory" class="required-label">الصنف</label>
                        <select id="productCategory">
                            <option value="medicine">دواء</option>
                            <option value="vaccine">تطعيم</option>
                            <option value="accessory">إكسسوار </option>
                            <option value="food">طعام</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="salePrice" class="required-label">سعر البيع <span
                                style="opacity: 0.2;">(للواحدة)</span></label>
                        <input id="salePrice" type="number" required>
                    </div>

                    <div class="field">
                        <label for="productMinStock" class="required-label">الحد الأدنى للمخزون</label>
                        <input id="productMinStock" type="number" min="1" required>
                    </div>

                    <div class="field">
                        <label for="productImage">الصورة</label>
                        <input id="productImage" type="file" accept="image/*">
                    </div>


                    <button type="submit" class="confirm">حفظ</button>
                    <button onclick="closeModal('productModal')" class="cancel">إلغاء</button>
                </form>

            </div>
        </div>

        <div id="editProductModal" class="modal">
            <div class="modal-content">

                <button class="close" onclick="closeModal('editProductModal')">×</button>

                <h3>تعديل المنتج</h3>
                <img id="edit_preview" style="width:120px; margin:10px 0; justify-self: center; display:none;" />
                <div class="field">
                    <label for="editProductName" class="required-label">الاسم</label>
                    <input type="text" id="edit_name" placeholder="اسم المنتج" required />
                </div>

                <div class="field">
                    <label for="editSalePrice" class="required-label">سعر البيع <span
                            style="opacity: 0.4;">(للواحدة)</span></label>
                    <input type="number" id="edit_price" placeholder="سعر البيع" required />
                </div>

                <div class="field">
                    <label for="editProductImage">الصورة</label>
                    <input type="file" id="edit_image_file" accept="image/*" />
                </div>

                <button onclick="submitEditProduct()" class="edit-product">حفظ التعديلات</button>

            </div>
        </div>

        <div id="adjustModal" class="modal">
            <div class="modal-content">

                <h3>تعديل الدفعة</h3>

                <div class="field">
                    <label class="required-label">الكمية</label>
                    <input type="number" id="edit_batch_qty" />
                </div>

                <div class="field">
                    <label class="required-label">سعر الشراء <span style="opacity: 0.4;">(للواحدة)</span></label>
                    <input type="number" id="edit_batch_price" />
                </div>

                <div class="field">
                    <label>اسم المورد</label>

                    <input type="text" id="edit_batch_supplier" />
                </div>

                <div class="field">
                    <label>تاريخ الانتهاء</label>
                    <input type="date" id="edit_batch_expiry" />
                </div>

                <div class="modal-actions">
                    <button onclick="submitAdjustment()" class="confirm">حفظ</button>
                    <button onclick="closeModal('adjustModal')" class="cancel">إلغاء</button>
                </div>

            </div>
        </div>
        <div id="confirmModal" class="modal">
            <div class="modal-content">
                <p id="confirmP"></p>
                <button id="confirmDelete">حذف</button>
                <button id="cancelDelete" class="cancel">إلغاء</button>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast"></div>
    </main>
    <script src="inventory.js"></script>
</body>

</html>
