<!DOCTYPE html>

    <meta charset="UTF-8" />

    <style>
        @import url("./style.css");

        .settings-wrap {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .settings-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: .03em;
            margin: 4px 2px 0;
        }

        .settings-card form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .settings-card label {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
        }

        .settings-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .settings-row>div {
            flex: 1;
            min-width: 220px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-preview {
            width: 84px;
            height: 84px;
            object-fit: contain;
            border: 1px solid var(--border);
            background: var(--surface-alt);
            border-radius: var(--r-md);
            flex-shrink: 0;
            padding: 8px;
        }

        input[type="file"]::file-selector-button {
            background-color: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary-soft-border);
            border-radius: var(--r-pill);
            padding: 7px 14px;
            cursor: pointer;
            margin-left: 12px;
            font-weight: 600;
            transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
        }

        input[type="file"]::file-selector-button:hover {
            background-color: var(--primary);
            color: white;
        }

        .backup-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .backup-row p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 13.5px;
            max-width: 400px;
        }

        #backupBtn {
            background: var(--surface-sunken);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            padding: 11px 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
            white-space: nowrap;
        }

        #backupBtn:hover {
            background: var(--primary-light);
            border-color: var(--primary-soft-border);
            color: var(--primary);
        }
    </style>
</head>

        <div class="page-header">

                <h1 class="page-title">الإعدادات</h1>
                <p class="page-subtitle">بيانات العيادة والنسخ الاحتياطي</p>
            </div>
        </div>

        <div class="settings-wrap">

            <p class="settings-section-title">بيانات العيادة</p>
            <div class="settings-card card">
                <form id="settingsForm">

                    <div class="logo-row">
                        <img id="logoPreview" class="logo-preview" src="./images/pawprint.png" alt="Logo Preview">
                        <div style="flex:1;">
                            <label for="logo">لوجو العيادة</label>
                            <input type="file" id="logo" accept="image/*">
                        </div>
                    </div>

                    <div>
                        <label for="clinic_name">اسم العيادة</label>
                        <input type="text" id="clinic_name">
                    </div>

                    <div class="settings-row">
                        <div>
                            <label for="phone">رقم الهاتف</label>
                            <input type="text" id="phone">
                        </div>
                    </div>

                    <div>
                        <label for="address">العنوان</label>
                        <textarea id="address" rows="3"></textarea>
                    </div>

                    <button class="btn-primary" type="submit">حفظ التغييرات</button>

                </form>
            </div>

            <p class="settings-section-title">النسخ الاحتياطي</p>
            <div class="settings-card card">
                <div class="backup-row">
                    <p>احفظ نسخة من بيانات العيادة بالكامل على جهازك لاستعادتها لاحقًا عند الحاجة.</p>
                    <button id="backupBtn">حفظ نسخة احتياطية 💾</button>
                </div>
            </div>
