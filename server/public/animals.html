<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <title>إدارة الحيوانات</title>
    <style>
        @import url("./style.css");

        #animalsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            padding: 4px 0 20px;
            direction: rtl;
        }

        /* الكارت الأساسي */
        .animal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 20px;
            box-shadow: var(--shadow-xs);
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: right;
            transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease), border-color var(--t-base) var(--ease);
        }

        .animal-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-soft-border);
        }

        .card-header {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-direction: row;
        }

        .animal-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .animal-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .animal-meta {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .animal-icon {
            font-size: 1.5rem;
            background: var(--primary-light);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--r-md);
            border: 1px solid var(--primary-soft-border);
            flex-shrink: 0;
        }

        .card-body {
            border-top: 1px dashed var(--border);
            padding-top: 12px;
        }

        .owner-info {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            flex-direction: row;
        }

        .owner-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-width: 0;
        }

        .owner-name {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .divider {
            color: var(--text-tertiary);
            font-size: 0.6rem;
        }

        .owner-phone {
            color: var(--text-tertiary);
            font-family: sans-serif;
            direction: ltr;
        }

        .owner-icon {
            font-size: 1rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        /* الفوتر والزرار */
        .card-footer {
            margin-top: 2px;
        }

        .btn-file {
            width: 100%;
            background: var(--primary);
            color: white;

            border: 1px solid var(--primary-soft-border);
            padding: 9px;
            border-radius: var(--r-sm);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
        }

        .btn-file:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .btn-file:active {
            transform: scale(0.98);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
            font-size: 14.5px;
            background: var(--surface-alt);
            border: 1px dashed var(--border-strong);
            border-radius: var(--r-lg);
        }
    </style>
</head>

    <main class="content">

        <div class="page-header">
            <div>
                <h1 class="page-title">الحيوانات</h1>
                <p class="page-subtitle">كل ملفات المرضى المسجّلين في العيادة</p>
            </div>
        </div>

        <div class="card">
            <input type="search" id="searchInput" placeholder="ابحث باسم العميل / رقم الهاتف / اسم الحيوان / النوع">
            <button id="addAnimalBtn">➕ إضافة حيوان</button>

            <div id="animalsGrid" class="animals-grid">
            </div>
            <div id="pagination"></div>

            <!-- ================= MODAL ================= -->
            <div id="animalFile" class="modal">

                <div class="modal-content">
                    <span class="close" id="closeAnimalFile">×</span>

                    <div id="animalInfo"></div>

                    <hr>

                    <h3>🩺 الزيارات</h3>
                    <div id="visitsList" class="visits-grid"></div>

                    <h3>💉 التطعيمات</h3>
                    <div id="vaccinationsList" class="vaccinations-grid"></div>
                    <button id="delete-animal" class="delete-animal">حذف الحيوان
                    </button>
                    <button id="editAnimalBtn" class="edit-animal">تعديل البيانات</button>
                    <a id="whatsapp"><button class="whatsapp"><img src="./images/whatsapp.png"
                                alt="whatsapp"></button></a>
                </div>
            </div>

            <div id="allVisitsModal" class="modal">
                <div class="modal-content">
                    <span class="close" id="closeVisits">×</span>
                    <h3>جميع الزيارات</h3>
                    <div id="allVisitsList" class="visits-grid"></div>
                </div>
            </div>

            <div id="confirmModal" class="modal">
                <div class="modal-content">
                    <p>هل أنت متأكد من حذف ملف الحيوان؟</p>
                    <button id="confirmDelete">حذف</button>
                    <button id="cancelDelete" class="cancel">إلغاء</button>
                </div>
            </div>

            <div id="imageModal" class="modal">
                <span id="closeImageModal"><img src="./images/close.png"></span>
                <div class="lightbox-content">
                    <button id="prevImage" class="nav-btn">❮</button>
                    <img id="lightboxImage" src="" />
                    <button id="nextImage" class="nav-btn">❯</button>
                </div>
            </div>

            <div id="animalModal" class="modal">
                <div class="modal-content">
                    <form id="animalForm">

                        <h3>👤 معلومات المالك</h3>

                        <div class="form-group">
                            <input id="new_owner" required />
                            <label for="new_owner" class="required-label"> اسم المالك</label>
                        </div>

                        <div class="form-group">
                            <input id="new_phone" pattern="^01[0-9]{9}$" required />
                            <label for="new_phone" class="required-label">رقم الهاتف</label>
                        </div>

                        <h3>🐾 معلومات الحيوان</h3>

                        <div class="form-group">
                            <input id="new_animal_name" required />
                            <label for="new_animal_name" class="required-label"> اسم الحيوان</label>
                        </div>

                        <div class="form-group">
                            <select id="new_animal_type" required>
                                <option value="" disabled selected hidden></option>
                                <option>قطة</option>
                                <option>كلب</option>
                                <option>أرنب</option>
                                <option>طائر</option>
                                <option>زواحف</option>
                                <option>قارض</option>
                                <option>آخر</option>
                            </select>
                            <label for="new_animal_type" class="required-label"> النوع</label>
                        </div>

                        <div class="form-group">
                            <select id="new_animal_gender" required>
                                <option value="" disabled selected hidden></option>
                                <option>ذكر</option>
                                <option>انثي</option>
                            </select>
                            <label for="new_animal_gender" class="required-label"> الجنس</label>
                        </div>

                        <div class="form-group">
                            <input id="new_animal_breed" />
                            <label for="new_animal_breed"> الفصيلة</label>
                        </div>

                        <div class="form-group">
                            <input type="number" id="new_animal_weight" step="0.1" min="0" />
                            <label for="new_animal_weight"> الوزن (كجم)</label>
                        </div>

                        <div class="form-group">
                            <input id="new_animal_color" />
                            <label for="new_animal_color"> اللون</label>
                        </div>

                        <div class="form-group">
                            <input id="new_animal_bd" type="date" />
                            <label for="new_animal_bd"> تاريخ الميلاد</label>
                        </div>

                        <div class="form-group">
                            <div class="spayed-toggle">
                                <input type="radio" id="spayed_yes" name="is_spayed" value="true" required />
                                <label for="spayed_yes">نعم</label>
                                <input type="radio" id="spayed_no" name="is_spayed" value="false" required />
                                <label for="spayed_no">لا</label>

                            </div>
                            <label class="required-label">هل تم التعقيم ؟ </label>
                        </div>

                        <div class="modal-actions">
                            <button id="saveAnimal" type="submit">حفظ</button>
                            <button id="cancelAnimal" class="cancel" type="button">إلغاء</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- Toast -->
            <div id="toast" class="toast"></div>
    </main>

    <script src="animals.js"></script>
</body>

</html>
